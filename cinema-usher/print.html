<title>כרטיסי קולנוע</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  body { margin: 0; padding: 16px; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #1a0d0f; color: #f6efe6; }
  .bar { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 16px; gap: 12px; flex-wrap: wrap; }
  .bar h1 { margin: 0; font-size: 20px; }
  .bar p { margin: 4px 0 0; font-size: 13px; color: #c9b8a8; }
  .bar a, .bar button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 10px; border: 0; background: #e8b84a; color: #2a1a05; text-decoration: none; cursor: pointer; }
  .list { display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; }
  .ticket { position: relative; width: 100%; aspect-ratio: 1600 / 702; break-inside: avoid; page-break-inside: avoid; }
  .ticket .bg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
  /* Panel covering the printed barcode in the stub */
  .qr {
    position: absolute; left: 84.6%; top: 21.2%; width: 11.2%; height: 52.5%;
    background: #fbf3e2; border: 2px solid #d9a441; border-radius: 6%/3%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%;
    box-shadow: inset 0 0 0 3px #fbf3e2, inset 0 0 0 4px rgba(217,164,65,.6);
  }
  .qr svg { width: 88%; height: auto; display: block; }
  .qr span { font-size: clamp(6px, 1.1vw, 11px); font-weight: 700; color: #8e1b2a; white-space: nowrap; }
  @media print {
    body { background: #fff; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bar { display: none; }
    .list { gap: 8mm; max-width: none; }
    .ticket { width: 190mm; }
    .ticket .bg { filter: none; }
    .qr span { font-size: 7pt; }
  }
</style>
</head>
