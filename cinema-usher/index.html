<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סדרן">
<meta name="theme-color" content="#0b0708">
<title>סדרן קולנוע</title>
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<style>
  :root {
    --bg: #0b0708;
    --panel: #171012;
    --panel-2: #21171a;
    --velvet: #8e1b2a;
    --velvet-2: #b3263a;
    --gold: #e8b84a;
    --gold-soft: #f3d58a;
    --text: #f6efe6;
    --muted: #a8988f;
    --ok: #3ecf7a;
    --bad: #ff5a5f;
    --warn: #ffb547;
    --line: rgba(232, 184, 74, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(142, 27, 42, .45), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    -webkit-user-select: none; user-select: none;
  }
  .app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 2px 4px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(145deg, var(--velvet-2), var(--velvet));
    display: grid; place-items: center; font-size: 20px;
    box-shadow: 0 4px 14px rgba(179, 38, 58, .45), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: .3px; }
  .brand small { display: block; color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: 1.5px; }
  .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; text-align: left; }
  .clock b { display: block; color: var(--text); font-size: 17px; }

  /* Marquee lights */
  .marquee { height: 6px; display: flex; justify-content: space-between; padding: 0 4px; }
  .marquee i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 6px var(--gold); animation: blink 1.6s infinite;
  }
  .marquee i:nth-child(odd) { animation-delay: .8s; }
  @keyframes blink { 50% { opacity: .25; box-shadow: none; } }

  /* Scanner */
  .scanner {
    position: relative; aspect-ratio: 1 / 1; border-radius: 22px; overflow: hidden;
    background: #000; border: 1px solid var(--line);
    box-shadow: 0 20px 40px rgba(0,0,0,.5);
  }
  .scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanner canvas { display: none; }
  .frame { position: absolute; inset: 16%; pointer-events: none; }
  .frame::before, .frame::after, .frame span::before, .frame span::after {
    content: ""; position: absolute; width: 34px; height: 34px;
    border: 4px solid var(--gold); filter: drop-shadow(0 0 6px rgba(232,184,74,.6));
  }
  .frame::before { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
  .frame::after { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .frame span::before { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
  .frame span::after { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  .laser {
    position: absolute; left: 18%; right: 18%; height: 2px; top: 20%;
    background: linear-gradient(90deg, transparent, var(--velvet-2), #ff8a95, var(--velvet-2), transparent);
    box-shadow: 0 0 12px 2px rgba(255, 70, 90, .7);
    animation: sweep 2.2s ease-in-out infinite alternate;
  }
  @keyframes sweep { to { top: 80%; } }
  .scanner.paused .laser { display: none; }
  .scanner .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle, rgba(33,23,26,.85), rgba(11,7,8,.97));
    padding: 24px;
  }
  .overlay p { color: var(--muted); margin: 8px 0 18px; font-size: 15px; line-height: 1.5; }
  .overlay .big { font-size: 46px; }
  .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .flash.ok { background: rgba(62, 207, 122, .35); animation: flash .5s ease-out; }
  .flash.bad { background: rgba(255, 90, 95, .4); animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

  button {
    font: inherit; border: 0; cursor: pointer; border-radius: 14px;
    padding: 14px 22px; font-weight: 700; font-size: 16px; color: var(--text);
  }
  .btn-primary {
    background: linear-gradient(180deg, var(--velvet-2), var(--velvet));
    box-shadow: 0 8px 20px rgba(142, 27, 42, .5), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn-ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--gold-soft); }
  button:active { transform: scale(.97); }

  /* Ticket result */
  .ticket {
    position: relative; display: grid; grid-template-columns: 1fr auto; align-items: stretch;
    background: linear-gradient(135deg, #2a1d20, var(--panel));
    border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
    min-height: 124px;
  }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; right: 118px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--bg); transform: translateX(50%);
  }
  .ticket::before { top: -11px; } .ticket::after { bottom: -11px; }
  .ticket .info { padding: 16px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .ticket.ok .status { color: var(--ok); } .ticket.ok .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .ticket.bad .status { color: var(--bad); } .ticket.bad .dot { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .ticket.dup .status { color: var(--warn); } .ticket.dup .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .ticket .sub { color: var(--muted); font-size: 14px; }
  .ticket .stub {
    width: 118px; border-right: 2px dashed rgba(232,184,74,.3);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(232,184,74,.08), transparent);
  }
  .stub label { font-size: 12px; color: var(--gold); letter-spacing: 2px; font-weight: 700; }
  .stub .num {
    font-size: 64px; line-height: 1; font-weight: 800; color: var(--gold-soft);
    font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(232,184,74,.35);
  }
  .ticket.bad .stub .num { color: var(--bad); text-shadow: none; }
  .pop { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* Hall map */
  .hall { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .hall-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .hall-head h2 { margin: 0; font-size: 15px; color: var(--gold-soft); }
  .hall-head .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .hall-head .count b { color: var(--text); }
  .screen {
    height: 18px; margin: 0 8% 18px; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    border-top: 3px solid rgba(246, 239, 230, .75);
    box-shadow: 0 -8px 24px rgba(246, 239, 230, .15);
    text-align: center; font-size: 10px; letter-spacing: 4px; color: var(--muted); padding-top: 4px;
  }
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 22px repeat(7, 1fr); gap: 6px; align-items: center; }
  .row > span { color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; }
  .seat {
    aspect-ratio: 1 / .9; border-radius: 9px 9px 5px 5px; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: var(--muted);
    background: var(--panel-2); border: 1px solid rgba(255,255,255,.06);
    position: relative; transition: background .25s, color .25s, transform .25s;
  }
  .seat::after {
    content: ""; position: absolute; bottom: -4px; left: 15%; right: 15%; height: 3px; border-radius: 2px;
    background: rgba(255,255,255,.08);
  }
  .seat.taken { background: linear-gradient(180deg, var(--velvet-2), var(--velvet)); color: #fff; }
  .seat.current {
    background: linear-gradient(180deg, var(--gold-soft), var(--gold)); color: #2a1a05;
    transform: translateY(-3px) scale(1.08); box-shadow: 0 0 18px rgba(232,184,74,.7);
    animation: glow 1.2s ease-in-out infinite alternate;
  }
  @keyframes glow { to { box-shadow: 0 0 6px rgba(232,184,74,.3); } }
  .legend { display: flex; gap: 14px; justify-content: center; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 5px; vertical-align: -1px; }

  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🎬</div>
      <div>
        <small>קולנוע רפפורט · אולם 29</small>
        <h1>סדרן קולנוע</h1>
      </div>
    </div>
    <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
  </header>
  <div class="marquee" aria-hidden="true"></div>

  <section class="scanner paused" id="scanner">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
    <div class="frame"><span></span></div>
    <div class="laser"></div>
    <div class="flash" id="flash"></div>
    <div class="overlay" id="overlay">
      <div>
        <div class="big">🎟️</div>
        <p id="overlayText">סרקו את קוד ה־QR שעל הכרטיס<br>כדי להציג את מספר הכיסא</p>
        <button class="btn-primary" id="startBtn">הפעלת מצלמה</button>
      </div>
    </div>
  </section>

  <section class="ticket" id="ticket" aria-live="polite">
    <div class="stub">
      <label>כיסא</label>
      <div class="num" id="seatNum">—</div>
    </div>
    <div class="info">
      <div class="status"><span class="dot"></span><span id="statusText">ממתין לסריקה</span></div>
      <div class="sub" id="subText">כוונו את המצלמה לקוד שעל הכרטיס</div>
    </div>
  </section>

  <section class="hall">
    <div class="hall-head">
      <h2>מפת האולם</h2>
      <div class="count"><b id="countTaken">0</b> / 14 הושבו</div>
    </div>
    <div class="screen">מסך</div>
    <div class="rows" id="rows"></div>
    <div class="legend">
      <span><i style="background:var(--panel-2);border:1px solid rgba(255,255,255,.15)"></i>פנוי</span>
      <span><i style="background:var(--velvet-2)"></i>הושב</span>
      <span><i style="background:var(--gold)"></i>סריקה אחרונה</span>
    </div>
  </section>

  <div class="actions">
    <button class="btn-ghost" id="resetBtn">איפוס הקרנה</button>
    <button class="btn-ghost" id="printBtn">הדפסת קודים</button>
  </div>
  <p class="hint">הסריקה מתבצעת במכשיר בלבד · לא נשלח מידע לשום שרת</p>
</div>

<script src="vendor/jsQR.js"></script>
<script src="seats.js"></script>
<script>
(() => {
  const TOTAL = 14, PER_ROW = 7, ROW_NAMES = ['א', 'ב'];
  const STORE_KEY = 'usher.seated.v1';
  const $ = id => document.getElementById(id);
  const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const scanner = $('scanner'), overlay = $('overlay');

  // Marquee lights
  document.querySelector('.marquee').innerHTML = '<i></i>'.repeat(18);

  // Clock
  const tick = () => {
    const d = new Date();
    $('time').textContent = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    $('date').textContent = d.toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' });
  };
  tick(); setInterval(tick, 10000);

  // Seated state (per-device convenience only)
  let seated = new Set();
  try { seated = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify([...seated])); } catch (e) {} };

  // Hall map
  const seatEls = {};
  ROW_NAMES.forEach((name, r) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span>${name}</span>`;
    for (let i = 1; i <= PER_ROW; i++) {
      const n = r * PER_ROW + i;
      const s = document.createElement('div');
      s.className = 'seat';
      s.textContent = n;
      seatEls[n] = s;
      row.appendChild(s);
    }
    $('rows').appendChild(row);
  });
  const renderMap = (current) => {
    for (let n = 1; n <= TOTAL; n++) {
      seatEls[n].classList.toggle('taken', seated.has(n));
      seatEls[n].classList.toggle('current', n === current);
    }
    $('countTaken').textContent = seated.size;
  };
  renderMap();

  // Feedback
  let audio;
  const beep = (ok) => {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine';
      o.frequency.value = ok ? 1320 : 220;
      g.gain.setValueAtTime(.18, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + (ok ? .18 : .4));
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + (ok ? .18 : .4));
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]);
  };
  const flash = (cls) => {
    const f = $('flash');
    f.className = 'flash'; void f.offsetWidth; f.className = 'flash ' + cls;
  };

  const seatLabel = n => `שורה ${ROW_NAMES[Math.floor((n - 1) / PER_ROW)]} · כיסא ${n}`;

  const showResult = (raw) => {
    const seat = (window.SEAT_CODES || {})[raw.trim()];
    const t = $('ticket'), num = $('seatNum');
    t.classList.remove('ok', 'bad', 'dup');
    num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');

    if (!seat) {
      t.classList.add('bad');
      num.textContent = '✕';
      $('statusText').textContent = 'קוד לא מוכר';
      $('subText').textContent = 'הכרטיס אינו שייך לאולם זה';
      flash('bad'); beep(false);
      renderMap();
      return;
    }
    const already = seated.has(seat);
    t.classList.add(already ? 'dup' : 'ok');
    num.textContent = seat;
    $('statusText').textContent = already ? 'כרטיס כבר נסרק' : 'כרטיס תקין — בבקשה להיכנס';
    $('subText').textContent = seatLabel(seat) + (already ? ' · הכיסא כבר סומן כתפוס' : '');
    seated.add(seat); save();
    flash(already ? 'bad' : 'ok'); beep(!already);
    renderMap(seat);
  };

  // Scanning
  let lastCode = '', lastAt = 0, running = false;
  const hasDetector = 'BarcodeDetector' in window;
  let detector = null;
  if (hasDetector) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }

  const handle = (code) => {
    const now = Date.now();
    // The same ticket held in view counts once; it can be re-scanned after leaving the frame for 3s
    const repeat = code === lastCode && now - lastAt < 3000;
    lastCode = code; lastAt = now;
    if (repeat) return;
    showResult(code);
  };

  const loop = async () => {
    if (!running) return;
    if (video.readyState >= 2 && video.videoWidth) {
      try {
        if (detector) {
          const codes = await detector.detect(video);
          if (codes.length) handle(codes[0].rawValue);
        } else {
          const scale = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
          const w = canvas.width = Math.round(video.videoWidth * scale);
          const h = canvas.height = Math.round(video.videoHeight * scale);
          ctx.drawImage(video, 0, 0, w, h);
          const img = ctx.getImageData(0, 0, w, h);
          const code = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
          if (code && code.data) handle(code.data);
        }
      } catch (e) {}
    }
    requestAnimationFrame(loop);
  };

  const start = async () => {
    // Unlock audio on iOS with the user's tap
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('overlayText').innerHTML = 'הדפדפן לא מאפשר גישה למצלמה.<br>יש לפתוח את הדף בכתובת https בספארי.';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } }
      });
      video.srcObject = stream;
      await video.play();
      overlay.style.display = 'none';
      scanner.classList.remove('paused');
      running = true;
      loop();
    } catch (e) {
      $('overlayText').innerHTML = 'אין גישה למצלמה.<br>יש לאשר גישה למצלמה בהגדרות ספארי ולנסות שוב.';
      $('startBtn').textContent = 'ניסיון נוסף';
    }
  };

  $('startBtn').addEventListener('click', start);

  // Stop the camera when the app goes to background, resume on return
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null; running = false;
      scanner.classList.add('paused');
      overlay.style.display = '';
      $('startBtn').textContent = 'חידוש סריקה';
    }
  });

  $('resetBtn').addEventListener('click', () => {
    if (!confirm('לאפס את כל הכיסאות להקרנה חדשה?')) return;
    seated.clear(); save(); lastCode = '';
    const t = $('ticket'); t.classList.remove('ok', 'bad', 'dup');
    $('seatNum').textContent = '—';
    $('statusText').textContent = 'ממתין לסריקה';
    $('subText').textContent = 'כוונו את המצלמה לקוד שעל הכרטיס';
    renderMap();
  });
  $('printBtn').addEventListener('click', () => { location.href = 'print.html'; });
})();
</script>
</body>
</html>
